schema: spec-driven

# Project context (shown to AI when creating artifacts)
context: |
  Tech stack: Next.js (App Router) + TypeScript + Supabase + Vercel
  Domain: SaaS de automação de campanhas de anúncios para lojistas físicos
  Design System: openspec/design-system/MASTER.md (immutable source of truth)
  Dashboard Layout: openspec/design-system/pages/dashboard.md (overrides Master)
  Icon Library: lucide-react (NO emojis as icons)
  Typography: Fira Sans (UI) + Fira Code (data/monospace)
  Theme: Dark Mode (OLED) — #020617 background, #F8FAFC text, #22C55E accent
  Styling: Tailwind CSS with CSS custom properties

# Per-artifact rules
rules:
  proposal:
    - Always reference design system from openspec/design-system/
    - Never suggest light mode or emoji icons
  tasks:
    - Break tasks into chunks of max 2 hours
    - Reference design-system/ pages for page-specific overrides
